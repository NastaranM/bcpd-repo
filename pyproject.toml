[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcpd"
version = "0.1.0"
description = "Recursive Bayesian changepoint detection for time-series data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nastaran Meftahi" }]
keywords = ["changepoint", "bayesian", "time-series"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/bcpd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
